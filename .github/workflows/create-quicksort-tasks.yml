name: Create QuickSort tasks

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-tasks:
    name: Create labels and issues
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Create common labels
        run: |
          gh label create "type: feature" --description "Новая функциональность" --color "1f883d" --force --repo "$REPO"
          gh label create "type: bug" --description "Ошибка или баг" --color "d1242f" --force --repo "$REPO"
          gh label create "type: docs" --description "Документация" --color "0969da" --force --repo "$REPO"
          gh label create "type: test" --description "Тестирование" --color "8250df" --force --repo "$REPO"

          gh label create "priority: low" --description "Низкий приоритет" --color "bfdbfe" --force --repo "$REPO"
          gh label create "priority: medium" --description "Средний приоритет" --color "fbca04" --force --repo "$REPO"
          gh label create "priority: high" --description "Высокий приоритет" --color "d1242f" --force --repo "$REPO"

          gh label create "needs review" --description "Нужна проверка другим участником" --color "d4c5f9" --force --repo "$REPO"

          gh label create "component: src" --description "Исходный код в папке src" --color "0e8a16" --force --repo "$REPO"
          gh label create "component: docs" --description "Документация в папке docs" --color "0052cc" --force --repo "$REPO"
          gh label create "component: test-results" --description "Результаты тестирования в папке test-results" --color "5319e7" --force --repo "$REPO"

      - name: Prepare issue bodies
        run: |
          mkdir -p /tmp/quicksort-issues

          cat > /tmp/quicksort-issues/vs-project.md <<'EOF'
          ## Описание

          Нужно создать базовый Visual Studio 2022 C++ проект в папке `src`.

          Название-заглушка проекта:

          ```text
          QuickSortPracticeApp
          ```

          Позже название можно поменять.

          ## Требования

          - проект должен лежать в папке `src`;
          - в `src` должен быть `.sln` файл;
          - проект должен собираться в конфигурации `Release|x64`;
          - не нужно добавлять временные файлы Visual Studio;
          - `.sln`, `.vcxproj`, `.cpp`, `.h` должны храниться в Git.

          ## Результат

          После выполнения GitHub Actions должен находить `.sln` внутри `src` и запускать MSBuild.

          ## Ветка

          ```bash
          feature/setup-visual-studio-project
          ```

          ## Pull Request

          ```text
          feature/setup-visual-studio-project -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/quicksort-algorithm.md <<'EOF'
          ## Описание

          Нужно реализовать алгоритм быстрой сортировки QuickSort на C++.

          ## Требования

          - реализация находится в папке `src`;
          - сортировка должна работать с массивом или `std::vector<int>`;
          - должна поддерживаться сортировка по возрастанию;
          - желательно отделить алгоритм сортировки от пользовательского интерфейса;
          - код должен быть понятным и пригодным для review.

          ## Проверка

          Проверить работу на массивах:

          - уже отсортированный массив;
          - массив в обратном порядке;
          - массив с одинаковыми значениями;
          - массив с отрицательными числами;
          - массив из одного элемента.

          ## Ветка

          ```bash
          feature/quicksort-algorithm
          ```

          ## Pull Request

          ```text
          feature/quicksort-algorithm -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/metrics.md <<'EOF'
          ## Описание

          Нужно добавить сбор метрик работы QuickSort.

          ## Метрики

          - количество сравнений;
          - количество перестановок или обменов;
          - количество рекурсивных вызовов;
          - размер входного массива;
          - время выполнения.

          ## Требования

          - метрики должны выводиться после сортировки;
          - метрики должны быть понятны пользователю;
          - сбор метрик не должен ломать основную сортировку.

          ## Ветка

          ```bash
          feature/quicksort-metrics
          ```

          ## Pull Request

          ```text
          feature/quicksort-metrics -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/console-interface.md <<'EOF'
          ## Описание

          Нужно сделать консольный интерфейс для приложения QuickSort.

          ## Требования

          В интерфейсе должны быть пункты:

          - создать массив вручную;
          - сгенерировать случайный массив;
          - загрузить массив из файла;
          - отсортировать текущий массив;
          - вывести результат;
          - выйти из программы.

          ## Требования к качеству

          - пользователь должен понимать, что нужно вводить;
          - программа не должна аварийно завершаться при неправильном вводе;
          - сообщения об ошибках должны быть понятными.

          ## Ветка

          ```bash
          feature/console-interface
          ```

          ## Pull Request

          ```text
          feature/console-interface -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/input-validation.md <<'EOF'
          ## Описание

          Нужно добавить валидацию входных данных.

          ## Проверить

          - пустой ввод;
          - нечисловые значения;
          - слишком маленький массив;
          - слишком большой массив;
          - некорректный формат файла;
          - отсутствие файла;
          - невозможность открыть файл.

          ## Результат

          Программа должна выводить понятное сообщение об ошибке и не должна аварийно завершаться.

          ## Ветка

          ```bash
          feature/input-validation
          ```

          ## Pull Request

          ```text
          feature/input-validation -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/file-io.md <<'EOF'
          ## Описание

          Нужно реализовать чтение массива из файла и сохранение результата сортировки.

          ## Требования

          - пользователь может указать путь к входному файлу;
          - файл содержит целые числа;
          - программа проверяет ошибки открытия и чтения файла;
          - отсортированный массив можно сохранить в файл;
          - результаты должны храниться в понятном формате.

          ## Рекомендация

          Для результатов можно использовать папку:

          ```text
          test-results/
          ```

          Но исходный код должен оставаться в `src`.

          ## Ветка

          ```bash
          feature/file-input-output
          ```

          ## Pull Request

          ```text
          feature/file-input-output -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/testing.md <<'EOF'
          ## Описание

          Нужно протестировать приложение QuickSort и оформить результаты тестирования.

          ## Проверить

          - обычный массив;
          - уже отсортированный массив;
          - массив в обратном порядке;
          - массив с одинаковыми значениями;
          - массив с отрицательными числами;
          - массив из одного элемента;
          - большой массив;
          - некорректный ввод;
          - чтение из файла;
          - сохранение результата.

          ## Результат

          Создать файл:

          ```text
          test-results/testing-report.md
          ```

          В отчёте указать:

          - что тестировалось;
          - входные данные;
          - ожидаемый результат;
          - фактический результат;
          - найденные ошибки.

          ## Ветка

          ```bash
          feature/testing-report
          ```

          ## Pull Request

          ```text
          feature/testing-report -> develop
          ```
          EOF

          cat > /tmp/quicksort-issues/docs.md <<'EOF'
          ## Описание

          Нужно подготовить документацию проекта.

          ## Документация должна содержать

          - цель проекта;
          - описание QuickSort;
          - как открыть проект в Visual Studio 2022;
          - где находится `.sln`;
          - как собрать проект;
          - как запустить программу;
          - как вводить данные;
          - как загрузить данные из файла;
          - где смотреть результаты тестирования;
          - известные ограничения.

          ## Результат

          Создать файл:

          ```text
          docs/user-guide.md
          ```

          ## Ветка

          ```bash
          feature/project-documentation
          ```

          ## Pull Request

          ```text
          feature/project-documentation -> develop
          ```
          EOF

      - name: Create issues
        run: |
          create_issue_if_missing() {
            TITLE="$1"
            LABELS="$2"
            BODY_FILE="$3"

            EXISTING_URL=$(gh issue list \
              --repo "$REPO" \
              --state all \
              --search "$TITLE in:title" \
              --json title,url \
              --jq ".[] | select(.title == \"$TITLE\") | .url" | head -n 1)

            if [ -n "$EXISTING_URL" ]; then
              echo "Issue already exists: $TITLE"
              echo "$EXISTING_URL"
            else
              echo "Creating issue: $TITLE"
              gh issue create \
                --repo "$REPO" \
                --title "$TITLE" \
                --label "$LABELS" \
                --body-file "$BODY_FILE"
            fi
          }

          create_issue_if_missing \
            "Создать Visual Studio 2022 C++ проект в src" \
            "type: feature,priority: high,component: src" \
            "/tmp/quicksort-issues/vs-project.md"

          create_issue_if_missing \
            "Реализовать алгоритм QuickSort" \
            "type: feature,priority: high,component: src" \
            "/tmp/quicksort-issues/quicksort-algorithm.md"

          create_issue_if_missing \
            "Добавить сбор метрик QuickSort" \
            "type: feature,priority: medium,component: src" \
            "/tmp/quicksort-issues/metrics.md"

          create_issue_if_missing \
            "Сделать консольный интерфейс приложения" \
            "type: feature,priority: high,component: src" \
            "/tmp/quicksort-issues/console-interface.md"

          create_issue_if_missing \
            "Добавить валидацию входных данных" \
            "type: feature,priority: medium,component: src" \
            "/tmp/quicksort-issues/input-validation.md"

          create_issue_if_missing \
            "Реализовать чтение и запись файлов" \
            "type: feature,priority: medium,component: src" \
            "/tmp/quicksort-issues/file-io.md"

          create_issue_if_missing \
            "Провести тестирование QuickSort" \
            "type: test,priority: high,component: test-results" \
            "/tmp/quicksort-issues/testing.md"

          create_issue_if_missing \
            "Подготовить документацию проекта" \
            "type: docs,priority: medium,component: docs" \
            "/tmp/quicksort-issues/docs.md"
